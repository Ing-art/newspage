services:
  app:
    image: newspage-app
    build:
      context: .
    env_file:
      - .env.docker
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - .:/var/www/html
      - ./.env.docker:/var/www/html/.env:ro
      - ./storage/app/public:/var/www/html/public/storage
      - composer_vendor:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  vite:
    image: node:20-bookworm
    working_dir: /var/www/html
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - .:/var/www/html
      - node_modules:/var/www/html/node_modules
    restart: unless-stopped

  worker:
    image: newspage-app
    env_file:
      - .env.docker
    command: php artisan queue:work --sleep=3 --tries=3 --backoff=5 --timeout=60
    volumes:
      - .:/var/www/html
      - ./.env.docker:/var/www/html/.env:ro
      - ./storage/app/public:/var/www/html/public/storage
      - composer_vendor:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    env_file:
      - .env.docker
    ports:
      - "${DB_FORWARD_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  composer_vendor:
  node_modules:
  mysql_data:
